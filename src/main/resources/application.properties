# --- Clinic Appointment System (COMP713 Assignment 2, Option A) ---

spring.application.name=clinic-appointments

# HTTP port (overridable via the SERVER_PORT environment variable, e.g. for containers)
server.port=${SERVER_PORT:8080}

# Error responses must not leak stack traces (errors are mapped to the ApiError model)
server.error.include-stacktrace=never

# --- Persistence: embedded H2 (no external database required) ---
spring.datasource.url=jdbc:h2:mem:clinicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# --- Actuator: expose only health and info ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- springdoc / Swagger UI at /swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html
